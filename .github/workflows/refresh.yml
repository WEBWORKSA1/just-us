name: Refresh site content

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours; the daily page rolls over at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/**"
      - "assets/css/**"
      - "assets/js/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh headlines and videos
        run: python scripts/update.py

      - name: Rebuild every page
        run: python scripts/build.py

      - name: Commit and push
        run: |
          git config user.name "just-us-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Auto-refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Mirror to gh-pages (only matters while Pages is served from that branch)
        run: git push --force origin HEAD:gh-pages || true
